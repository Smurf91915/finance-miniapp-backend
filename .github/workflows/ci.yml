name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_NAME: Finance Mini App API
      BOT_TOKEN: test-bot-token
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/finance_miniapp_ci
      DEBUG: "true"
      ALLOW_INSECURE_DEV_AUTH: "true"
      DEFAULT_TELEGRAM_ID: "448027140"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install -e .

      - name: Initialize database
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE finance_miniapp_ci;" || true
          python - <<'PY'
          from sqlalchemy import select

          import app.models  # noqa: F401
          from app.db.base import Base
          from app.db.session import SessionLocal, engine
          from app.models import User

          Base.metadata.create_all(bind=engine)

          with SessionLocal() as db:
              if db.scalar(select(User).where(User.telegram_id == 448027140)) is None:
                  db.add(
                      User(
                          telegram_id=448027140,
                          name="CI",
                          timezone="Europe/Samara",
                          currency="RUB",
                      )
                  )
                  db.commit()
          PY

      - name: Verify imports and syntax
        run: |
          python -m compileall app
          python - <<'PY'
          import app.bot.main  # noqa: F401
          import app.main  # noqa: F401
          PY

      - name: Smoke test API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap "kill $api_pid" EXIT

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/backend-health.json; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/health >/tmp/backend-health.json
          curl -fsS -H "X-Telegram-Id: 448027140" \
            http://127.0.0.1:8000/api/v1/dashboard >/tmp/backend-dashboard.json
          curl -fsS -H "X-Telegram-Id: 448027140" \
            http://127.0.0.1:8000/api/v1/categories >/tmp/backend-categories.json

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/backend-health.json").read_text())
          dashboard = json.loads(Path("/tmp/backend-dashboard.json").read_text())
          categories = json.loads(Path("/tmp/backend-categories.json").read_text())

          assert health == {"status": "ok"}
          assert dashboard["available_minor"] == 0
          assert isinstance(categories, list)
          PY

      - name: Smoke test income, goals, recurring and parse flows
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap "kill $api_pid" EXIT

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/backend-health-flows.json; then
              break
            fi
            sleep 1
          done

          python scripts/smoke_test_api.py
