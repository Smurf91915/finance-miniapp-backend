[project]
name = "finance-miniapp-backend"
version = "0.1.0"
description = "Backend for a personal finance Telegram Mini App."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15.0",
    "aiohttp-socks>=0.10.1",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
